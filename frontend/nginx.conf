server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # API requests are proxied to the backend container so the frontend can keep
    # using relative URLs (/api/v1, /health) in Docker.
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (AI report stream) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location = /health {
        set $backend http://backend:8000;
        proxy_pass $backend/health;
        proxy_set_header Host $host;
    }

    # Client-side routing: every unknown path renders the React app.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html must never be cached: it is the only file that points to the
        # hashed bundle, so a stale copy keeps the browser on old JS after a rebuild.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    # Hashed assets never change content, so they can be cached forever.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
